{% extends "blog/base.html" %}

{% block content %}
<p class="page-kicker mb-2">Latest</p>
<h1 class="h3 fw-bold mb-4">Posts</h1>

{% for post in posts %}
<article class="card-post p-4 p-md-4">
    <h2 class="h4 fw-bold mb-2">{{ post.title }}</h2>
    <p class="post-meta mb-3">{{ post.author }} · {{ post.date_posted }}</p>
    <p class="mb-0">{{ post.content }}</p>
</article>
{% empty %}
<div class="empty-state">
    <p class="mb-0">No posts found.</p>
</div>
{% endfor %}
{% endblock %}
